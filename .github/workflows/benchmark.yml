name: Benchmark

on:
  push:
    tags: ["*"]

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DELLALGO_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Benchmark
        run: ctest --test-dir build --output-on-failure -R "^Bench_"
